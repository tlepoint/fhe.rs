name: Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Codecov OIDC authentication; no stored upload token.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install coverage tool
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-llvm-cov
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends protobuf-compiler
      - name: Generate combined coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --locked --no-report
          cargo llvm-cov --workspace --locked --all-features --no-report
          mkdir -p target/coverage
          cargo llvm-cov report --lcov --output-path target/coverage/lcov.info --ignore-filename-regex '/(proto|tests|benches|examples)/|/build\.rs$'
      - name: Save coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: target/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14
      - name: Upload coverage to Codecov
        # Dependabot has a read-only token. Its coverage remains in the artifact.
        # The Codecov action automatically uses tokenless uploads for public forks.
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: target/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
