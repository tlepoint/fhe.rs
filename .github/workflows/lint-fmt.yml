
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'

name: Linter and Formatter

jobs:
  fmt:
    name: Rustfmt
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  clippy:
    name: Clippy (${{ matrix.features }})
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [default, all]
    steps:
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: clippy
      - uses: actions/checkout@v7
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --workspace --all-targets ${{ matrix.features == 'all' && '--all-features' || '' }} -- -D warnings
