# Recommended method in https://matklad.github.io/2021/08/22/large-rust-workspaces.html
[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
authors = ["Tancrède Lepoint"]
edition = "2024"
repository = "https://github.com/tlepoint/fhe.rs"
license = "MIT"
rust-version = "1.91.1"

[workspace.lints.rust]
missing_docs = "warn"
unused_imports = "warn"
unused_must_use = "deny"

[workspace.dependencies]
clap = { version = "^4.6.6", features = ["derive"] }
tfhe-ntt = "^0.7.1"
console = "^0.16.4"
criterion = "^0.8.2"
doc-comment = "^0.3.4"
env_logger = "^0.11.11"
ethnum = "^1.5.3"
indicatif = "^0.18.6"
itertools = "^0.15.0"
log = "^0.4.33"
ndarray = "^0.17.2"
num-bigint = "^0.5.1"
num-bigint-dig = "^0.9.1"
num-traits = "^0.2.19"
proptest = "^1.11.0"
prost = "^0.14.4"
prost-build = "^0.14.4"
pulp = "^0.22.3"
rand = "^0.10.2"
rand_chacha = "^0.10.0"
sha2 = "^0.11.0"
thiserror = "^2.0.20"
zeroize = "^1.9.0"
zeroize_derive = "^1.5.0"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
fallible_impl_from = "deny"
wildcard_enum_match_arm = "deny"
# Note: unneeded_field_pattern is intentionally not enabled because it conflicts
# with the defensive programming pattern of explicitly listing all struct fields
# in destructuring to ensure compiler catches when new fields are added.
fn_params_excessive_bools = "deny"
must_use_candidate = "warn"
